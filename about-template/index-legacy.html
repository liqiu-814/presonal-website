        <h3>Adam & Ewa – Premium Photography Website with Smooth Animations</h3>
        <p>Adam & Ewa is a premium commercial website built from scratch by creative developer Tomasz Szmajda (ITom) for a wedding photography and videography duo based in Poland. The project replaces a decade-old legacy site with a bespoke, template-free experience built on React Router v7, GSAP ScrollTrigger, Lenis smooth scroll, and Sanity headless CMS. It features an asymmetrical scattered gallery layout with parallax drift, FLIP-technique shared element lightbox transitions, scroll-driven typography animations with progressive blur reveal, and a custom double-layer DOM virtualization system using IntersectionObserver. This virtualization enables smooth 60fps scrolling through galleries containing up to 1000 high-resolution wedding photos — a massive engineering challenge solved entirely in frontend code. Images are optimized through Sanity's CDN with device-responsive sizing, WebP/AVIF auto-formatting, and LQIP blur-up placeholders. The site scores a perfect 100/100 on Google Lighthouse. Typography combines Cormorant Garamond serif headings with Inter body text on a warm eggshell background. The client manages all content independently through Sanity Studio.</p>
        <a href="https://www.adam-ewa.pl">Visit Adam & Ewa – Premium Photography Website with Smooth Animations</a>
      </li>

        <h3>67 Game – Browser Webcam Game with Real-Time Pose Tracking</h3>
        <p>67 Game is a browser-based speed challenge created by Tomasz Szmajda (ITom) where your webcam becomes the controller. Players perform the viral '67' trend moves as fast as possible within 15 seconds while MediaPipe Pose Landmarker tracks wrist positions in real-time at 60fps — entirely in the browser with no downloads or plugins required. Built with React 19 and MediaPipe WASM running on GPU, the game features a global daily leaderboard powered by Firebase, auto-generated PDF certificates with QR codes, Canvas-based particle effects, and bilingual support in Polish and English. Debuted at the University of Opole Science Festival 2026 where over 100 people queued to play. Kids speedran attempts while adults were amazed that real-time computer vision runs natively in a web browser. A project that pushes the boundaries of creative frontend engineering.</p>
        <a href="https://sixsevengame.vercel.app">Visit 67 Game – Browser Webcam Game with Real-Time Pose Tracking</a>
      </li>
      <li>
        <h3>Young Multi – Artist Website with Custom WebGL Image Distortion</h3>
        <p>Young Multi is an immersive artist website created by creative developer Tomasz Szmajda (ITom) for Polish hip-hop artist Young Multi. The project captures the raw, energetic feel of the artist's music through custom WebGL shader effects — real-time image distortion that warps and bends photographs on mouse movement, powered by GPU-accelerated fragment shaders rather than CSS filters or tricks. The dark, moody layout with smooth GSAP scroll transitions lets the photography breathe while keeping a high-energy visual identity. This was ITom's breakthrough project that earned major industry recognition including CSS Design Awards (CSSDA) Site of the Day and Design Nominees Site of the Day, putting his work on the international creative development map. Built with React, WebGL, and GSAP, the project shows how creative coding and custom shaders can transform a standard artist page into an interactive experience that truly matches the musician's brand.</p>

    <article>
      <h3>What makes ITom different from other developers?</h3>
      <p>ITom codes everything from scratch — no WordPress, no Webflow, no templates. His philosophy is "mechanics first": he perfects the layout, scroll behavior, and performance before adding any visual effects. This means every site runs smoothly at 60fps even on mobile phones. He combines award-winning creative execution with solid engineering fundamentals, delivering websites that look impressive and actually perform well under the hood.</p>

    <article>
      <h3>What technologies does ITom use?</h3>
      <p>ITom's main tools are React, Next.js, JavaScript, GSAP (GreenSock) for animation, and CSS. For smooth scrolling he uses Lenis, and for content management Sanity headless CMS with Vercel hosting. When projects require it, he also works with Three.js, React Three Fiber, and WebGL for interactive browser-based experiences. He codes everything from scratch — no templates, no page builders.</p>
    </article>
    <article>
      <h3>Who is ITom and what does he do?</h3>
      <p>ITom is the creative alias of Tomasz Szmajda, a frontend developer from Poland who builds interactive, handcrafted websites from scratch. He focuses on smooth animations, scroll-driven storytelling, and clean code — creating sites that feel alive and engaging. His work ranges from animated portfolio websites to webcam-controlled browser games, and has been recognized with awards including FWA Site of the Day and CSS Design Awards.</p>
    </article>
    <article>
      <h3>What kind of websites does ITom build?</h3>
      <p>ITom builds a range of interactive websites — from storytelling portfolios with smooth scroll animations and page transitions, to immersive artist sites with custom visual effects, to clean commercial websites for businesses that need premium aesthetics and fast performance. He prefers projects where animation and user experience tell a story rather than just display content statically. Every project is coded from scratch with no templates.</p>

    <article>
      <h3>What is 67 Game and how does it work?</h3>
      <p>67 Game is a browser-based speed challenge at sixsevengame.vercel.app where your webcam is the controller. You perform the viral '67' trend moves as fast as possible in 15 seconds while MediaPipe tracks your wrists in real-time — entirely in the browser with zero downloads needed. Built with React 19 and MediaPipe WASM on GPU. Features include a global daily leaderboard via Firebase, auto-generated PDF certificates with QR codes, particle effects, and Polish/English language support. Over 100 people queued to play it at a university science festival.</p>
    </article>
